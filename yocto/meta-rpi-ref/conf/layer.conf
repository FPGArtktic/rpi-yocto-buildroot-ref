BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi-ref"
BBFILE_PATTERN_rpi-ref = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi-ref = "10"

LAYERDEPENDS_rpi-ref = "core raspberrypi"
LAYERSERIES_COMPAT_rpi-ref = "scarthgap"
